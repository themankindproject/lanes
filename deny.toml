[advisories]
# Severity defaults: vulnerability = deny, unmaintained = warn, yanked = warn,
# notice = warn (cargo-deny 0.19 defaults). Ignore lists can be added below:
# ignore = ["RUSTSEC-0000-0000"]

[licenses]
# unlicensed/allow are handled via the `allow` list below (cargo-deny 0.19).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []