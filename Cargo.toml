[package]
name = "lanes"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "SIMD-accelerated numerical kernels with runtime dispatch: elementwise math, norms, distances, and divergences for f32/f64 — no_std, SSE2/AVX2/AVX-512/NEON"
categories = ["algorithms", "science", "no-std"]
keywords = ["simd", "algorithms", "performance", "kernels"]
readme = "README.md"
repository = "https://github.com/themankindproject/lanes"
homepage = "https://github.com/themankindproject/lanes"
authors = ["bravo1goingdark <kumarashutosh34169@gmail.com>"]
exclude = [
    "fuzz",
    ".github",
    ".gitignore",
    "benches",
    "tests",
    "examples",
    "clippy.toml",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "kernels"
harness = false

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
