[package]
name = "lanes-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.lanes]
path = ".."

# Prevent this from interfering with the parent crate's build.
[workspace]

[[bin]]
name = "fuzz_reductions"
path = "fuzz_targets/fuzz_reductions.rs"
doc = false

[[bin]]
name = "fuzz_contracts"
path = "fuzz_targets/fuzz_contracts.rs"
doc = false

[[bin]]
name = "fuzz_exp"
path = "fuzz_targets/fuzz_exp.rs"
doc = false

[[bin]]
name = "fuzz_f64"
path = "fuzz_targets/fuzz_f64.rs"
doc = false

[[bin]]
name = "fuzz_norms"
path = "fuzz_targets/fuzz_norms.rs"
doc = false

[[bin]]
name = "fuzz_divergence"
path = "fuzz_targets/fuzz_divergence.rs"
doc = false

[[bin]]
name = "fuzz_binary"
path = "fuzz_targets/fuzz_binary.rs"
doc = false

[[bin]]
name = "fuzz_i8"
path = "fuzz_targets/fuzz_i8.rs"
doc = false

[[bin]]
name = "fuzz_erf"
path = "fuzz_targets/fuzz_erf.rs"
doc = false
