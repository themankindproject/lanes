name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # rust-toolchain.toml pins 1.89.0, which overrides the action's stable
      # for cargo invocations, so the wasm32 target must be added to the
      # *pinned* toolchain explicitly (the action only adds it to stable).
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --target wasm32-unknown-unknown
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Minimum Supported Rust Version: the whole check/test surface must keep
  # compiling on 1.89.0 (required for stable AVX-512 target_feature).
  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # Doctests get their own job so a doc example regression is reported
  # independently of the main test run.
  doctest:
    name: doctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --all-features

  # Line coverage via LLVM source-based instrumentation (llvm-cov), run on
  # the same pinned toolchain as everything else. Produces lcov, enforces a
  # minimum line threshold, and uploads to Codecov when a token is present.
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: generate coverage (lcov) and enforce threshold
        # One invocation: lcov for Codecov plus the line gate, so the
        # counters are merged once (a separate `report` step can lose the
        # profraw data between Actions steps). ~70% line floor: scalar +
        # native-backend kernels are fully exercised, but the non-native
        # SIMD files (avx2/avx512 on this runner, or neon on x86) are
        # only compiled, not executed.
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 70
      - name: upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true

  # Execute the NEON kernels on real ARM64 silicon. The aarch64 code is
  # compiled by the `ci` job's clippy/check but only *runs* here — this
  # validates the per-backend tests on hardware.
  aarch64:
    name: test (aarch64, native)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # Undefined-behavior detection via the Miri interpreter. Runs the scalar
  # kernel tests (the portable unsafe surface: raw-pointer loads, tail
  # handling) under Miri, which catches out-of-bounds reads, dangling
  # pointers, and provenance violations that normal tests miss.
  # Miri is nightly-only. SIMD kernels are excluded: Miri's x86 baseline
  # lacks the feature set (e.g. sse3) that compiler-generated code for
  # vector intrinsics requires, so it flags false UB — those kernels are
  # validated by the native test + aarch64 jobs on real hardware.
  # The `+nightly` override is required: rust-toolchain.toml pins 1.89.0,
  # which has no miri component.
  miri:
    name: Miri (UB check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test --all-features --lib kernels::scalar
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  # Fuzz smoke test: prove every fuzz target compiles and runs for a short
  # burst under cargo-fuzz (nightly). Full fuzzing is a dev activity; CI
  # only proves the harnesses stay healthy (compile + no instant crash).
  # The `+nightly` override is required: rust-toolchain.toml pins 1.89.0,
  # which cargo-fuzz no longer supports (needs 1.91+).
  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --fuzz-dir fuzz
      - name: Smoke-run fuzz targets
        run: |
          for target in fuzz/fuzz_targets/*.rs; do
            name=$(basename "$target" .rs)
            cargo +nightly fuzz run --fuzz-dir fuzz "$name" -- -runs=1000 || exit 1
          done
