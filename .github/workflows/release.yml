name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-dry-run:
    name: Publish (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify package builds cleanly
        run: cargo package --allow-dirty

      - name: Dry-run publish
        run: cargo publish --dry-run --allow-dirty

      # NOTE: Actual publishing to crates.io is done manually:
      #
      #   cargo publish
      #
      # This requires a valid CARGO_REGISTRY_TOKEN. To automate this,
      # add the token as a GitHub secret and uncomment the step below:
      #
      # - name: Publish to crates.io
      #   run: cargo publish
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
