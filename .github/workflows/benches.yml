name: Benchmarks

on:
  push:
    branches: [main]
    paths: ["benches/**", "src/**", "Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Bench (backend=${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # AVX-512 requires a runner with avx512f (self-hosted); GH-hosted
        # x64 runners only expose AVX2. Add "avx512" to the matrix when
        # running on suitable hardware.
        backend: [scalar, avx2]
    env:
      LANES_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Detect CPU features
        run: |
          echo "avx2:    $(grep -o 'avx2' /proc/cpuinfo | head -1)"
          echo "avx512f: $(grep -o 'avx512f' /proc/cpuinfo | head -1)"

      - name: Run benchmarks
        run: cargo bench --bench kernels -- --output-format bencher | tee bench_output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.backend }}
          path: |
            bench_output.txt
            target/criterion/
          retention-days: 30